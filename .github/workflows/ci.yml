name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: synkro-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: synkro-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: synkro-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: synkro-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: synkro-windows-amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
            artifact_name: synkro-windows-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw -y --no-progress
          echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          else
            VERSION="${{ github.ref }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        run: |
          export CGO_ENABLED=1
          if [ "${{ matrix.goos }}" = "windows" ]; then
            export CC=gcc
          fi

          echo "Building ${{ matrix.artifact_name }}..."

          go build -v \
            -ldflags="-s -w \
            -X main.Version=${{ steps.version.outputs.VERSION }} \
            -X main.Commit=${{ github.sha }}" \
            -trimpath \
            -o synkro${{ matrix.goos == 'windows' && '.exe' || '' }} \
            ./cmd/synkro

          ./synkro${{ matrix.goos == 'windows' && '.exe' || '' }} version

      - name: Create installer scripts
        shell: bash
        run: |
          mkdir -p package
          cp synkro${{ matrix.goos == 'windows' && '.exe' || '' }} package/

          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp install.ps1 package/
            printf '@echo off\r\npowershell -ExecutionPolicy Bypass -File install.ps1\r\n' > package/install.bat
          else
            cp install.sh package/
            chmod +x package/install.sh
            tar czf package/synkro-${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_name }}.tar.gz \
              -C package \
              synkro${{ matrix.goos == 'windows' && '.exe' || '' }} \
              install.sh
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: package/
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}